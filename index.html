<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-HUB | Modular SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- Sidebar -->
    <aside id="sidebar-container"
        class="w-full md:w-72 md:sticky md:top-0 md:h-screen bg-zinc-900/50 border-r border-zinc-800 p-6 z-40">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 bg-emerald-500 rounded-lg flex items-center justify-center font-bold text-zinc-950">AI
            </div>
            <h1 class="text-xl font-bold tracking-tight">AI-HUB</h1>
        </div>

        <nav id="sidebar-nav" class="space-y-1 mb-10">
            <!-- Categories injected here -->
        </nav>

        <div class="pt-6 border-t border-zinc-800 space-y-4">
            <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest px-2">Pricing Filters</h3>

            <!-- Free Switch -->
            <label class="flex items-center justify-between cursor-pointer group px-2">
                <span class="text-sm font-medium text-zinc-400 group-hover:text-zinc-200 transition-colors">Free</span>
                <div class="relative">
                    <input type="checkbox" class="pricing-filter sr-only peer" value="free">
                    <div
                        class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600 peer-checked:after:bg-zinc-100">
                    </div>
                </div>
            </label>

            <!-- Freemium Switch -->
            <label class="flex items-center justify-between cursor-pointer group px-2">
                <span
                    class="text-sm font-medium text-zinc-400 group-hover:text-zinc-200 transition-colors">Freemium</span>
                <div class="relative">
                    <input type="checkbox" class="pricing-filter sr-only peer" value="freemium">
                    <div
                        class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600 peer-checked:after:bg-zinc-100">
                    </div>
                </div>
            </label>

            <!-- Paid Switch -->
            <label class="flex items-center justify-between cursor-pointer group px-2">
                <span class="text-sm font-medium text-zinc-400 group-hover:text-zinc-200 transition-colors">Paid</span>
                <div class="relative">
                    <input type="checkbox" class="pricing-filter sr-only peer" value="paid">
                    <div
                        class="w-11 h-6 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600 peer-checked:after:bg-zinc-100">
                    </div>
                </div>
            </label>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 min-w-0 flex flex-col">
        <!-- Header / Search -->
        <header class="p-6 md:p-10 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-30 border-b border-zinc-800/50">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-4 md:items-center justify-between">
                <div class="relative flex-1 max-w-2xl">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-500">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Search AI tools, categories, or features..."
                        class="w-full bg-zinc-900 border border-zinc-700 text-zinc-100 rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all">
                </div>
                <div class="hidden md:flex items-center gap-2 text-sm text-zinc-400">
                    <span class="px-2 py-1 bg-zinc-800 rounded border border-zinc-700">ESC</span> to clear
                </div>
            </div>
        </header>

        <!-- Grid -->
        <div class="p-6 md:p-10 flex-1 overflow-y-auto">
            <div id="tool-grid"
                class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Cards injected here -->
            </div>

            <div id="no-results" class="hidden flex-col items-center justify-center py-20 text-zinc-500">
                <svg class="w-16 h-16 mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-xl">No tools found matching your search.</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
